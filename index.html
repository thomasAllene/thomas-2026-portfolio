    <!--
      GitHub Pages has no server-side routing, so a hard refresh on /projects
      returns 404.html. That file bounces the path here as a ?/ query string,
      which this snippet turns back into a real URL before React Router boots.
      Technique: rafgraph/spa-github-pages (MIT).
    -->
    <script>
        (function () {
            var l = window.location;
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }());
    </script>
