# Builds the Vite site and publishes it to GitHub Pages on every push.
#
# REQUIRED ONE-TIME SETUP:
#   Repo -> Settings -> Pages -> Source -> "GitHub Actions"
# Without that, the deploy job fails with a "Pages not configured" error.
# (The old `gh-pages` branch is no longer used by this workflow.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, react-development]
  workflow_dispatch:

# Least privilege: read the repo, publish Pages, and mint the OIDC token
# that actions/deploy-pages uses to authenticate.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer run cancel the older one so the
# live site always reflects the most recent commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # react-router 7 requires Node >= 20
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
