<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
        // Single Page Apps for GitHub Pages — rafgraph/spa-github-pages (MIT).
        // GitHub Pages serves this file for any unknown path (e.g. a refresh on
        // /projects). It rewrites that path into a ?/ query string and bounces to
        // index.html, where a matching snippet restores the real URL for React Router.
        //
        // 1 = number of leading path segments to keep, i.e. the repo name for a
        // project site. Set to 0 if you deploy to a user site (user.github.io).
        var pathSegmentsToKeep = 1;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body></body>

</html>
